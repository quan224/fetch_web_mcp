// 统计
function updateStats(data) {
  const up = data.filter(a => a.todayChange > 0).length;
  const down = data.filter(a => a.todayChange < 0).length;
  const neutral = data.filter(a => a.todayChange === 0).length;
  const maxUp = data.reduce((m, a) => a.todayChange > m ? a.todayChange : m, -Infinity);
  const maxDown = data.reduce((m, a) => a.todayChange < m ? a.todayChange : m, Infinity);
  document.getElementById('upCount').textContent = up;
  document.getElementById('downCount').textContent = down;
  document.getElementById('neutralCount').textContent = neutral;
  document.getElementById('maxChange').textContent = maxUp > 0 ? '+' + maxUp.toFixed(2) + '%' : '-';
  document.getElementById('minChange').textContent = maxDown < 0 ? maxDown.toFixed(2) + '%' : '-';
  document.getElementById('updateTime').textContent = DATA.meta.updateTime;
  document.getElementById('totalCount').textContent = DATA.meta.total;
}

// 渲染TOP5分区
function renderTop5(data) {
  // 涨幅前5（排除todayChange=0）
  const topUp = data.filter(a => a.todayChange > 0).sort((a, b) => b.todayChange - a.todayChange).slice(0, 5);
  // 跌幅前5
  const topDown = data.filter(a => a.todayChange < 0).sort((a, b) => a.todayChange - b.todayChange).slice(0, 5);
  // 价格前5
  const topPrice = data.filter(a => a.currentPrice > 0).sort((a, b) => b.currentPrice - a.currentPrice).slice(0, 5);

  function renderItem(item, i, valueClass, valueText) {
    const gradeColors = { 5: '#ffd740', 4: '#ce93d8', 3: '#4fc3f7', 2: '#66bb6a', 1: '#e0e0e0' };
    const gc = gradeColors[item.grade] || '#e0e0e0';
    return '<div class="top-item">' +
      '<span class="rank r' + (i + 1) + '">' + (i + 1) + '</span>' +
      '<span class="item-grade g' + item.grade + '">' + item.grade + '级</span>' +
      '<span class="item-name" style="color:' + gc + '">' + item.name + '</span>' +
      '<span class="item-value ' + valueClass + '">' + valueText + '</span>' +
      '</div>';
  }

  document.getElementById('topUp').innerHTML = topUp.map((a, i) =>
    renderItem(a, i, 'up', '+' + a.todayChange.toFixed(2) + '%')
  ).join('');

  document.getElementById('topDown').innerHTML = topDown.map((a, i) =>
    renderItem(a, i, 'down', a.todayChange.toFixed(2) + '%')
  ).join('');

  document.getElementById('topPrice').innerHTML = topPrice.map((a, i) =>
    renderItem(a, i, 'price-val', a.currentPrice.toLocaleString())
  ).join('');
}

// 渲染表格
function renderTable(data) {
  const tbody = document.getElementById('ammoTable');
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="no-data">没有匹配的数据</td></tr>';
    return;
  }
  tbody.innerHTML = data.map((a, i) => {
    const changeClass = a.todayChange > 0 ? 'up' : a.todayChange < 0 ? 'down' : 'zero';
    const changeText = a.todayChange > 0 ? '+' + a.todayChange.toFixed(2) + '%' : a.todayChange < 0 ? a.todayChange.toFixed(2) + '%' : '0%';
    const gradeColors = { 5: '#ffd740', 4: '#ce93d8', 3: '#4fc3f7', 2: '#66bb6a', 1: '#e0e0e0' };
    const gradeColor = gradeColors[a.grade] || '#8899aa';
    return '<tr>' +
      '<td style="color:#556677">' + (i + 1) + '</td>' +
      '<td class="name-cell" style="color:' + gradeColor + '">' + a.name + '</td>' +
      '<td><span style="color:' + gradeColor + ';font-weight:700;font-size:13px">' + a.grade + '级</span></td>' +
      '<td class="gs-cell price">' + a.goldStandard.toFixed(2) + '</td>' +
      '<td class="gs-cell">' + a.goldStandardPer.toFixed(2) + '</td>' +
      '<td class="price">' + a.currentPrice.toLocaleString() + '</td>' +
      '<td><span class="change ' + changeClass + '">' + changeText + '</span></td>' +
      '</tr>';
  }).join('');
}

// 筛选排序
function filterAndSort() {
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  const filter = document.getElementById('filterChange').value;
  const grade = parseInt(document.getElementById('filterGrade').value);
  const sortVal = document.getElementById('sortBy').value;

  let list = DATA.ammo.slice();

  // 搜索
  if (keyword) {
    list = list.filter(a => a.name.toLowerCase().includes(keyword));
  }

  // 筛选涨跌
  if (filter === 'up') list = list.filter(a => a.todayChange > 0);
  else if (filter === 'down') list = list.filter(a => a.todayChange < 0);
  else if (filter === 'zero') list = list.filter(a => a.todayChange === 0);

  // 筛选等级
  if (grade > 0) list = list.filter(a => a.grade === grade);

  // 排序
  const [field, order] = sortVal.split('_');
  list.sort((a, b) => {
    let va = a[field], vb = b[field];
    if (field === 'name') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (va < vb) return order === 'asc' ? -1 : 1;
    if (va > vb) return order === 'asc' ? 1 : -1;
    return 0;
  });

  renderTable(list);
}

document.getElementById('filterGrade').addEventListener('change', filterAndSort);
document.getElementById('sortBy').addEventListener('change', filterAndSort);

const gradeColors = { 5: '#ffd740', 4: '#ce93d8', 3: '#4fc3f7' };
let priceChart = null;
let chartGradeFilter = 0;

function buildChartDatasets(gradeFilter, keyword) {
  const filtered = HISTORY.series.filter(s => {
    if (gradeFilter > 0 && s.grade !== gradeFilter) return false;
    if (keyword && !s.name.toLowerCase().includes(keyword.toLowerCase())) return false;
    return true;
  });
  return filtered.map(s => ({
    label: s.name,
    data: s.prices,
    borderColor: gradeColors[s.grade] || '#4fc3f7',
    backgroundColor: gradeColors[s.grade] + '20',
    borderWidth: 1.5,
    pointRadius: 3,
    pointHoverRadius: 5,
    tension: 0.3,
    spanGaps: true,
    hidden: false
  }));
}

function renderChart(gradeFilter, keyword) {
  const canvas = document.getElementById('priceChart');
  const emptyEl = document.getElementById('chartEmpty');

  if (HISTORY.timePoints.length < 2) {
    canvas.style.display = 'none';
    emptyEl.style.display = 'block';
    return;
  }
  canvas.style.display = 'block';
  emptyEl.style.display = 'none';

  const datasets = buildChartDatasets(gradeFilter, keyword);

  if (priceChart) {
    priceChart.data.labels = HISTORY.timePoints;
    priceChart.data.datasets = datasets;
    priceChart.update();
    return;
  }

  priceChart = new Chart(canvas, {
    type: 'line',
    data: { labels: HISTORY.timePoints, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: '#8899aa',
            font: { size: 11 },
            boxWidth: 12,
            padding: 8,
            usePointStyle: true
          },
          onClick: function(e, item, legend) {
            const index = item.datasetIndex;
            const ci = legend.chart;
            if (ci.isDatasetVisible(index)) {
              ci.hide(index);
              item.hidden = true;
            } else {
              ci.show(index);
              item.hidden = false;
            }
          }
        },
        tooltip: {
          backgroundColor: '#1a2a3a',
          borderColor: '#2a3a4a',
          borderWidth: 1,
          titleColor: '#fff',
          bodyColor: '#e0e0e0',
          padding: 10,
          callbacks: {
            label: function(ctx) {
              const val = ctx.parsed.y;
              return ctx.dataset.label + ': ' + (val != null ? val.toLocaleString() : '无数据');
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#1a2a3a' },
          ticks: { color: '#8899aa', font: { size: 11 } }
        },
        y: {
          grid: { color: '#1a2a3a' },
          ticks: {
            color: '#8899aa',
            font: { size: 11 },
            callback: function(val) { return val.toLocaleString(); }
          }
        }
      }
    }
  });
}
